<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Tracking Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            transition: background-color 0.3s, color 0.3s;
        }
        body.dark-mode {
            background-color: #333;
            color: #fff;
        }
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }
        body.dark-mode .dashboard {
            background: #444;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .toggle-btn {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .toggle-btn:hover {
            background: #0056b3;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        .stat {
            text-align: center;
            padding: 20px;
            background: #e9ecef;
            border-radius: 8px;
            flex: 1;
            margin: 0 10px;
            transition: background-color 0.3s;
        }
        body.dark-mode .stat {
            background: #555;
        }
        .stat h2 {
            margin: 0;
            color: #333;
        }
        body.dark-mode .stat h2 {
            color: #fff;
        }
        .stat p {
            margin: 5px 0 0;
            color: #666;
        }
        body.dark-mode .stat p {
            color: #ccc;
        }
        .form-section {
            margin-bottom: 20px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            transition: background-color 0.3s;
        }
        body.dark-mode .form-section {
            background: #555;
        }
        .form-group {
            margin-bottom: 10px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .btn {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        .btn:hover {
            background: #218838;
        }
        .filter-section {
            margin-bottom: 20px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            transition: background-color 0.3s;
        }
        body.dark-mode .filter-section {
            background: #555;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            transition: background-color 0.3s;
        }
        body.dark-mode table {
            background: #444;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        body.dark-mode th, body.dark-mode td {
            border-bottom: 1px solid #666;
        }
        th {
            background-color: #f2f2f2;
        }
        body.dark-mode th {
            background-color: #666;
        }
        canvas {
            max-width: 100%;
            height: 250px;
        }
        #monthlyChart, #donorChart {
            height: 200px;
        }
        .action-btn {
            padding: 5px 10px;
            margin: 0 5px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        .edit-btn {
            background: #ffc107;
            color: black;
        }
        .edit-btn:hover {
            background: #e0a800;
        }
        .delete-btn {
            background: #dc3545;
            color: white;
        }
        .delete-btn:hover {
            background: #c82333;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            border-radius: 8px;
        }
        body.dark-mode .modal-content {
            background-color: #444;
            color: #fff;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        body.dark-mode .close {
            color: #ccc;
        }
        body.dark-mode .close:hover {
            color: #fff;
        }
        @media (max-width: 768px) {
            .stats {
                flex-direction: column;
            }
            .stat {
                margin-bottom: 10px;
            }
            .header {
                flex-direction: column;
                text-align: center;
            }
            .toggle-btn {
                margin-top: 10px;
            }
            table {
                font-size: 14px;
            }
            th, td {
                padding: 8px;
            }
        }
        .btn, .toggle-btn, .action-btn {
            transition: background-color 0.3s, transform 0.2s;
        }
        .btn:hover, .toggle-btn:hover, .action-btn:hover {
            transform: scale(1.05);
        }
        .chart-container {
            animation: fadeIn 1s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>Donation Tracking Dashboard</h1>
            <button class="toggle-btn" id="dark-mode-toggle">Toggle Dark Mode</button>
        </div>
        <div class="stats">
            <div class="stat">
                <h2 id="total-donations">$0</h2>
                <p>Total Donations Received</p>
            </div>
            <div class="stat">
                <h2 id="num-donors">0</h2>
                <p>Number of Donors</p>
            </div>
        </div>
        <div class="form-section">
            <h2>Add New Donation</h2>
            <div class="form-group">
                <label for="donor-name">Donor Name:</label>
                <input type="text" id="donor-name" placeholder="Enter donor name">
            </div>
            <div class="form-group">
                <label for="donation-amount">Amount:</label>
                <input type="number" id="donation-amount" placeholder="Enter amount">
            </div>
            <div class="form-group">
                <label for="donation-category">Category:</label>
                <select id="donation-category">
                    <option value="General">General</option>
                    <option value="Education">Education</option>
                    <option value="Health">Health</option>
                    <option value="Environment">Environment</option>
                </select>
            </div>
            <div class="form-group">
                <label for="donation-date">Date:</label>
                <input type="date" id="donation-date">
            </div>
            <button class="btn" id="add-donation-btn">Add Donation</button>
            <button class="btn" id="export-csv-btn">Export to CSV</button>
            <button class="btn" id="export-pdf-btn">Export to PDF</button>
        </div>
        <div class="filter-section">
            <h2>Filter Donations</h2>
            <div class="form-group">
                <label for="filter-donor">Filter by Donor:</label>
                <input type="text" id="filter-donor" placeholder="Enter donor name">
            </div>
            <div class="form-group">
                <label for="filter-start-date">Start Date:</label>
                <input type="date" id="filter-start-date">
            </div>
            <div class="form-group">
                <label for="filter-end-date">End Date:</label>
                <input type="date" id="filter-end-date">
            </div>
            <div class="form-group">
                <label for="filter-min-amount">Min Amount:</label>
                <input type="number" id="filter-min-amount" placeholder="Min amount">
            </div>
            <div class="form-group">
                <label for="filter-max-amount">Max Amount:</label>
                <input type="number" id="filter-max-amount" placeholder="Max amount">
            </div>
            <div class="form-group">
                <label for="filter-category">Filter by Category:</label>
                <select id="filter-category">
                    <option value="">All</option>
                    <option value="General">General</option>
                    <option value="Education">Education</option>
                    <option value="Health">Health</option>
                    <option value="Environment">Environment</option>
                </select>
            </div>
            <button class="btn" id="apply-filter-btn">Apply Filter</button>
            <button class="btn" id="clear-filter-btn">Clear Filter</button>
            <button class="btn" id="sort-date-btn">Sort by Date</button>
            <button class="btn" id="sort-amount-btn">Sort by Amount</button>
        </div>
        <h2>Donation Trends</h2>
        <canvas id="donationChart"></canvas>
        <h2>Monthly Donation Totals</h2>
        <canvas id="monthlyChart"></canvas>
        <h2>Donor Distribution</h2>
        <canvas id="donorChart"></canvas>
        <h2>Donations</h2>
        <table id="donation-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Donor</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Donations will be populated here -->
            </tbody>
        </table>

        <div id="edit-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Edit Donation</h2>
                <div class="form-group">
                    <label for="edit-donor-name">Donor Name:</label>
                    <input type="text" id="edit-donor-name">
                </div>
                <div class="form-group">
                    <label for="edit-donation-amount">Amount:</label>
                    <input type="number" id="edit-donation-amount">
                </div>
                <div class="form-group">
                    <label for="edit-donation-category">Category:</label>
                    <select id="edit-donation-category">
                        <option value="General">General</option>
                        <option value="Education">Education</option>
                        <option value="Health">Health</option>
                        <option value="Environment">Environment</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="edit-donation-date">Date:</label>
                    <input type="date" id="edit-donation-date">
                </div>
                <button class="btn" id="save-edit-btn">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // Dummy data
        let donations = [
            { date: '2023-01-01', donor: 'Alice', amount: 100, category: 'General' },
            { date: '2023-01-05', donor: 'Bob', amount: 50, category: 'Education' },
            { date: '2023-01-10', donor: 'Charlie', amount: 200, category: 'Health' },
            { date: '2023-01-15', donor: 'Alice', amount: 75, category: 'Environment' },
            { date: '2023-01-20', donor: 'Diana', amount: 150, category: 'General' },
            { date: '2023-01-25', donor: 'Bob', amount: 25, category: 'Education' },
            { date: '2023-02-01', donor: 'Eve', amount: 300, category: 'Health' },
            { date: '2023-02-05', donor: 'Alice', amount: 100, category: 'Environment' },
            { date: '2023-02-10', donor: 'Frank', amount: 50, category: 'General' },
            { date: '2023-02-15', donor: 'Diana', amount: 200, category: 'Education' }
        ];

        let donationChart, monthlyChart, donorChart;
        let currentFiltered = donations;
        let editingIndex = -1;

        // LocalStorage functions
        function saveDonations() {
            localStorage.setItem('donations', JSON.stringify(donations));
        }

        function loadDonations() {
            const stored = localStorage.getItem('donations');
            if (stored) {
                donations = JSON.parse(stored);
            }
        }

        function updateDashboard(filteredDonations = donations) {
            // Calculate total donations
            const totalDonations = filteredDonations.reduce((sum, d) => sum + d.amount, 0);
            document.getElementById('total-donations').textContent = `$${totalDonations}`;

            // Calculate number of unique donors
            const uniqueDonors = new Set(filteredDonations.map(d => d.donor)).size;
            document.getElementById('num-donors').textContent = uniqueDonors;

            // Populate table
            const tableBody = document.querySelector('#donation-table tbody');
            tableBody.innerHTML = '';
            filteredDonations.forEach((donation) => {
                const originalIndex = donations.indexOf(donation);
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${donation.date}</td>
                    <td>${donation.donor}</td>
                    <td>$${donation.amount}</td>
                    <td>${donation.category}</td>
                    <td>
                        <button class="action-btn edit-btn" data-index="${originalIndex}">Edit</button>
                        <button class="action-btn delete-btn" data-index="${originalIndex}">Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            // Update line chart (cumulative donations over time)
            const sortedDonations = filteredDonations.sort((a, b) => new Date(a.date) - new Date(b.date));
            const labels = [];
            const data = [];
            let cumulative = 0;
            sortedDonations.forEach(donation => {
                cumulative += donation.amount;
                labels.push(donation.date);
                data.push(cumulative);
            });

            if (donationChart) donationChart.destroy();
            const ctx = document.getElementById('donationChart').getContext('2d');
            donationChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Cumulative Donations',
                        data: data,
                        borderColor: 'rgba(75, 192, 192, 1)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        fill: true,
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

        // Update bar chart (monthly totals)
        const monthlyTotals = {};
        filteredDonations.forEach(donation => {
            const month = donation.date.substring(0, 7); // YYYY-MM
            monthlyTotals[month] = (monthlyTotals[month] || 0) + donation.amount;
        });
        const monthlyLabels = Object.keys(monthlyTotals).sort();
        const monthlyData = monthlyLabels.map(month => monthlyTotals[month]);

        if (monthlyChart) monthlyChart.destroy();
        const ctx2 = document.getElementById('monthlyChart').getContext('2d');
        monthlyChart = new Chart(ctx2, {
            type: 'bar',
            data: {
                labels: monthlyLabels,
                datasets: [{
                    label: 'Monthly Donations',
                    data: monthlyData,
                    backgroundColor: 'rgba(54, 162, 235, 0.6)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        // Update pie chart (donor distribution)
        const donorTotals = {};
        filteredDonations.forEach(donation => {
            donorTotals[donation.donor] = (donorTotals[donation.donor] || 0) + donation.amount;
        });
        const donorLabels = Object.keys(donorTotals);
        const donorData = donorLabels.map(donor => donorTotals[donor]);

        if (donorChart) donorChart.destroy();
        const ctx3 = document.getElementById('donorChart').getContext('2d');
        donorChart = new Chart(ctx3, {
            type: 'pie',
            data: {
                labels: donorLabels,
                datasets: [{
                    label: 'Donor Distribution',
                    data: donorData,
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.6)',
                        'rgba(54, 162, 235, 0.6)',
                        'rgba(255, 205, 86, 0.6)',
                        'rgba(75, 192, 192, 0.6)',
                        'rgba(153, 102, 255, 0.6)',
                        'rgba(255, 159, 64, 0.6)'
                    ],
                    borderColor: [
                        'rgba(255, 99, 132, 1)',
                        'rgba(54, 162, 235, 1)',
                        'rgba(255, 205, 86, 1)',
                        'rgba(75, 192, 192, 1)',
                        'rgba(153, 102, 255, 1)',
                        'rgba(255, 159, 64, 1)'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true
            }
        });
        }

        // Initial load
        updateDashboard();

        // Dark mode toggle
        document.getElementById('dark-mode-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });

        // Add donation
        document.getElementById('add-donation-btn').addEventListener('click', () => {
            const donor = document.getElementById('donor-name').value.trim();
            const amount = parseFloat(document.getElementById('donation-amount').value);
            const category = document.getElementById('donation-category').value;
            const date = document.getElementById('donation-date').value;

            if (donor && amount > 0 && date) {
                donations.push({ date, donor, amount, category });
                updateDashboard();
                // Clear form
                document.getElementById('donor-name').value = '';
                document.getElementById('donation-amount').value = '';
                document.getElementById('donation-date').value = '';
            } else {
                alert('Please fill in all fields correctly.');
            }
        });

        // Export to CSV
        document.getElementById('export-csv-btn').addEventListener('click', () => {
            const csvContent = 'data:text/csv;charset=utf-8,' +
                'Date,Donor,Amount,Category\n' +
                donations.map(d => `${d.date},${d.donor},${d.amount},${d.category}`).join('\n');
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement('a');
            link.setAttribute('href', encodedUri);
            link.setAttribute('download', 'donations.csv');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // Apply filter
        document.getElementById('apply-filter-btn').addEventListener('click', () => {
            const filterDonor = document.getElementById('filter-donor').value.toLowerCase();
            const startDate = document.getElementById('filter-start-date').value;
            const endDate = document.getElementById('filter-end-date').value;
            const minAmount = parseFloat(document.getElementById('filter-min-amount').value) || 0;
            const maxAmount = parseFloat(document.getElementById('filter-max-amount').value) || Infinity;
            const filterCategory = document.getElementById('filter-category').value;

            let filtered = donations;
            if (filterDonor) {
                filtered = filtered.filter(d => d.donor.toLowerCase().includes(filterDonor));
            }
            if (startDate) {
                filtered = filtered.filter(d => d.date >= startDate);
            }
            if (endDate) {
                filtered = filtered.filter(d => d.date <= endDate);
            }
            if (minAmount > 0) {
                filtered = filtered.filter(d => d.amount >= minAmount);
            }
            if (maxAmount < Infinity) {
                filtered = filtered.filter(d => d.amount <= maxAmount);
            }
            if (filterCategory) {
                filtered = filtered.filter(d => d.category === filterCategory);
            }
            updateDashboard(filtered);
        });

        // Clear filter
        document.getElementById('clear-filter-btn').addEventListener('click', () => {
            document.getElementById('filter-donor').value = '';
            document.getElementById('filter-start-date').value = '';
            document.getElementById('filter-end-date').value = '';
            document.getElementById('filter-min-amount').value = '';
            document.getElementById('filter-max-amount').value = '';
            document.getElementById('filter-category').value = '';
            updateDashboard();
        });

        // Sort by date
        document.getElementById('sort-date-btn').addEventListener('click', () => {
            donations.sort((a, b) => new Date(a.date) - new Date(b.date));
            updateDashboard();
        });

        // Sort by amount
        document.getElementById('sort-amount-btn').addEventListener('click', () => {
            donations.sort((a, b) => b.amount - a.amount);
            updateDashboard();
        });

        // Edit and Delete functionality
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('edit-btn')) {
                const index = parseInt(e.target.getAttribute('data-index'));
                editingIndex = index;
                const donation = donations[index];
                document.getElementById('edit-donor-name').value = donation.donor;
                document.getElementById('edit-donation-amount').value = donation.amount;
                document.getElementById('edit-donation-category').value = donation.category;
                document.getElementById('edit-donation-date').value = donation.date;
                document.getElementById('edit-modal').style.display = 'block';
            } else if (e.target.classList.contains('delete-btn')) {
                const index = parseInt(e.target.getAttribute('data-index'));
                if (confirm('Are you sure you want to delete this donation?')) {
                    donations.splice(index, 1);
                    updateDashboard();
                }
            }
        });

        // Close modal
        document.querySelector('.close').addEventListener('click', () => {
            document.getElementById('edit-modal').style.display = 'none';
        });

        // Save edit
        document.getElementById('save-edit-btn').addEventListener('click', () => {
            const donor = document.getElementById('edit-donor-name').value.trim();
            const amount = parseFloat(document.getElementById('edit-donation-amount').value);
            const category = document.getElementById('edit-donation-category').value;
            const date = document.getElementById('edit-donation-date').value;

            if (donor && amount > 0 && date && editingIndex !== -1) {
                donations[editingIndex] = { date, donor, amount, category };
                updateDashboard();
                document.getElementById('edit-modal').style.display = 'none';
                editingIndex = -1;
            } else {
                alert('Please fill in all fields correctly.');
            }
        });

        // Close modal when clicking outside
        window.addEventListener('click', (e) => {
            const modal = document.getElementById('edit-modal');
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
